<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Metricas da RenoveJa+: 3.904 testes automatizados, 1 patente BR, assinatura ICP-Brasil PAdES, custo zero para o SUS">
