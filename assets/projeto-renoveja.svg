<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="t">
<title id="t">RenoveJá+ — Telessaúde para o SUS e para a rede privada: renovação de receita de uso contínuo, pedido de exames, teleconsulta com prontuário assistido, balcão da UBS ligado ao CADSUS e assinatura digital ICP-Brasil. A IA confere e sugere — quem decide e assina é sempre o médico. Eu sou o desenvolvedor principal.</title>
