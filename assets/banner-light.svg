    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1000" height="280" rx="16"/></clipPath>
    <path id="ecg" fill="none" d="M 0 244 H 120 l 18 0 l 11 -9 l 11 20 l 13 -44 l 13 44 l 11 -13 l 11 0 H 400 l 18 0 l 11 -7 l 11 16 l 13 -34 l 13 34 l 11 -11 l 11 0 H 690 l 18 0 l 11 -9 l 11 20 l 13 -44 l 13 44 l 11 -13 l 11 0 H 1000"/>
  </defs>

  <g clip-path="url(#round)">
