    <rect width="1000" height="280" fill="url(#grid)"/>
    
    <g transform="translate(886 104)">
      <circle r="5.5" fill="#0757ba" fill-opacity="0.95"/>
      
      <circle r="9" fill="none" stroke="#0757ba" stroke-width="1.4" stroke-opacity="0.4">
        <animate attributeName="r" values="9;58" dur="3.3s" begin="0.00s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.3s" begin="0.00s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="none" stroke="#3444c7" stroke-width="1.4" stroke-opacity="0.4">
        <animate attributeName="r" values="9;58" dur="3.3s" begin="1.10s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.3s" begin="1.10s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="none" stroke="#6224b8" stroke-width="1.4" stroke-opacity="0.4">
        <animate attributeName="r" values="9;58" dur="3.3s" begin="2.20s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.3s" begin="2.20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0" y="0" width="5" height="280" fill="url(#rail)"/>
    
    <g transform="translate(56 34)">
      <rect x="0" y="0" width="430" height="26" rx="13" fill="#0757ba" fill-opacity="0.08" stroke="#0757ba" stroke-opacity="0.34"/>
      <circle cx="17" cy="13" r="4" fill="#116329">
        <animate attributeName="fill-opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
