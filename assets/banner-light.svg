<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Felipe Menezes &#8212; SRE no BTG Pactual e fundador da RenoveJ&#225;+, plataforma de telessa&#250;de para o setor p&#250;blico">
  <title>FELIPE MENEZES &#8212; SRE @ BTG Pactual / Founder &amp; Full-Stack @ RenoveJ&#225;+ / Healthtech B2G</title>
  <defs>
