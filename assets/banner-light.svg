      <text x="30" y="17.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#0757ba" letter-spacing="1.5">SA&#218;DE P&#218;BLICA DIGITAL / SISTEMAS CR&#205;TICOS / 24x7</text>
    </g>
    <text x="54" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="0.4" fill="url(#name)">FELIPE MENEZES</text>
    
    <text x="56" y="166" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#424a53">SRE @ BTG Pactual<tspan fill="#6224b8" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Founder &amp; Full-Stack @ RenoveJ&#225;+<tspan fill="#0757ba" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Healthtech B2G</text>
    <text x="56" y="196" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#5b636c">De dia um banco n&#227;o cai. De noite uma receita chega ao paciente certo.</text>
    
    <use xlink:href="#ecg" stroke="url(#accent)" stroke-width="9" stroke-opacity="0.14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="0">
