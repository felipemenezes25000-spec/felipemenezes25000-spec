<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Felipe Menezes — SRE no BTG Pactual e fundador da RenoveJa+">
  <title>Felipe Menezes — SRE @ BTG Pactual · Founder @ RenoveJa+</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#f0eefc"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="0.5" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#6E40C9"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.75" stop-color="#1f3d63"/>
      <stop offset="1" stop-color="#5b2fb0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 V40 M0 40 H40" fill="none" stroke="#0d1117" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="0" y="0" width="1000" height="300" rx="18"/>
    </clipPath>

    <path id="ecg" fill="none" d="M 0 265 H 140 l 20 0 l 12 -10 l 12 22 l 14 -48 l 14 48 l 12 -14 l 12 0 H 430 l 20 0 l 12 -8 l 12 18 l 14 -38 l 14 38 l 12 -12 l 12 0 H 720 l 20 0 l 12 -10 l 12 22 l 14 -48 l 14 48 l 12 -14 l 12 0 H 1000"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- radar / ping motif -->
    <g transform="translate(872 116)">
      <circle r="6" fill="#0969DA" fill-opacity="0.9"/>
      <circle r="10" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-opacity="0.4">
        <animate attributeName="r" values="10;62" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#6E40C9" stroke-width="1.5" stroke-opacity="0.4">
        <animate attributeName="r" values="10;62" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#3B5BDB" stroke-width="1.5" stroke-opacity="0.4">
        <animate attributeName="r" values="10;62" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- accent rail -->
    <rect x="0" y="0" width="5" height="300" fill="url(#accent)"/>

    <!-- status chip -->
    <g transform="translate(56 36)">
      <rect x="0" y="0" width="366" height="28" rx="14" fill="#0969DA" fill-opacity="0.07" stroke="#0969DA" stroke-opacity="0.3"/>
      <circle cx="18" cy="14" r="4" fill="#1A7F37">
        <animate attributeName="fill-opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#0a4d8c">SISTEMAS CRITICOS &#183; 24/7 &#183; EM PRODUCAO</text>
    </g>

    <!-- name -->
    <text x="54" y="132" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="0.5" fill="url(#nameGrad)">FELIPE MENEZES</text>

    <!-- role -->
    <text x="56" y="168" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">SRE @ BTG Pactual<tspan fill="#6E40C9" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Founder @ RenoveJa+<tspan fill="#0969DA" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Patente BR</text>

    <!-- tagline -->
    <text x="56" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#57606a">De dia mantenho um banco de pe. De noite, codigo que atende o SUS de graca.</text>

    <!-- ECG glow -->
    <use xlink:href="#ecg" stroke="url(#accent)" stroke-width="9" stroke-opacity="0.13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.4s" fill="freeze"/>
    </use>

    <!-- ECG line -->
    <use xlink:href="#ecg" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.4s" fill="freeze"/>
    </use>

    <!-- traveling pulse -->
    <circle r="4.5" fill="#0d1117" fill-opacity="0.85">
      <animateMotion dur="6s" repeatCount="indefinite" begin="3.2s" rotate="auto">
        <mpath xlink:href="#ecg"/>
      </animateMotion>
    </circle>

    <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#d0d7de"/>
  </g>
</svg>
