      <stop offset="1" stop-color="#6224b8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0757ba"/><stop offset="1" stop-color="#6224b8"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.68" stop-color="#1b3f70"/>
      <stop offset="1" stop-color="#6224b8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
