<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Felipe Menezes — SRE no BTG Pactual e fundador da RenoveJa+">
  <title>Felipe Menezes — SRE @ BTG Pactual · Founder @ RenoveJa+</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101620"/>
      <stop offset="1" stop-color="#171029"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#cfe8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 V40 M0 40 H40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="0" y="0" width="1000" height="300" rx="18"/>
    </clipPath>

    <path id="ecg" fill="none" d="M 0 265 H 140 l 20 0 l 12 -10 l 12 22 l 14 -48 l 14 48 l 12 -14 l 12 0 H 430 l 20 0 l 12 -8 l 12 18 l 14 -38 l 14 38 l 12 -12 l 12 0 H 720 l 20 0 l 12 -10 l 12 22 l 14 -48 l 14 48 l 12 -14 l 12 0 H 1000"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- radar / ping motif -->
    <g transform="translate(872 116)">
      <circle r="6" fill="#00D9FF" fill-opacity="0.9"/>
      <circle r="10" fill="none" stroke="#00D9FF" stroke-width="1.5" stroke-opacity="0.5">
        <animate attributeName="r" values="10;62" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.5">
        <animate attributeName="r" values="10;62" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" begin="1.06s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5">
        <animate attributeName="r" values="10;62" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" begin="2.13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- accent rail -->
    <rect x="0" y="0" width="5" height="300" fill="url(#accent)"/>

    <!-- status chip -->
    <g transform="translate(56 36)">
      <rect x="0" y="0" width="366" height="28" rx="14" fill="#00D9FF" fill-opacity="0.08" stroke="#00D9FF" stroke-opacity="0.35"/>
      <circle cx="18" cy="14" r="4" fill="#3FB950">
        <animate attributeName="fill-opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#7ee7ff">SISTEMAS CRITICOS &#183; 24/7 &#183; EM PRODUCAO</text>
    </g>

    <!-- name -->
    <text x="54" y="132" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="0.5" fill="url(#nameGrad)">FELIPE MENEZES</text>

    <!-- role -->
    <text x="56" y="168" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#c9d1d9">SRE @ BTG Pactual<tspan fill="#7C3AED" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Founder @ RenoveJa+<tspan fill="#00D9FF" font-weight="700">&#160;&#160;/&#160;&#160;</tspan>Patente BR</text>

    <!-- tagline -->
    <text x="56" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e">De dia mantenho um banco de pe. De noite, codigo que atende o SUS de graca.</text>

    <!-- ECG glow -->
    <use xlink:href="#ecg" stroke="url(#accent)" stroke-width="9" stroke-opacity="0.14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.4s" fill="freeze"/>
    </use>

    <!-- ECG line -->
    <use xlink:href="#ecg" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="3.4s" fill="freeze"/>
    </use>

    <!-- traveling pulse -->
    <circle r="4.5" fill="#ffffff" fill-opacity="0.95">
      <animateMotion dur="6s" repeatCount="indefinite" begin="3.2s" rotate="auto">
        <mpath xlink:href="#ecg"/>
      </animateMotion>
    </circle>

    <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#30363d"/>
  </g>
</svg>
