  <text x="40" y="58" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#94A3B8">A REGRA DA CASA</text>
  <text x="40" y="94" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">Nenhum degrau vale pelo seguinte.</text>
  <text x="40" y="124" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E2E8F0">Teste verde não é servidor de pé. Servidor de pé não é produção. Produção não é validação externa.</text>
