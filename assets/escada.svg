      <text x="536" y="278" font-family="'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#22D3EE">03</text>
      <text x="564" y="278" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#F8FAFC">executado no servidor</text>
    </g><g class="d3">
