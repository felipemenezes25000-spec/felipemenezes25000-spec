      <text x="296" y="310" font-family="'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#60A5FA">02</text>
      <text x="324" y="310" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#F8FAFC">testado</text>
    </g><g class="d2">
      <rect x="520" y="246" width="226" height="114" rx="12" fill="#22D3EE" fill-opacity=".16" stroke="#22D3EE" stroke-width="2"/>
