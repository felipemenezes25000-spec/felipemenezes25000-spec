<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Escada de evid&#234;ncia em cinco degraus: escrito, testado, executado no servidor, em produ&#231;&#227;o e validado externamente">
  <title>Nenhuma etapa vale pela seguinte.</title>
  <defs>
<linearGradient id="track" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0757ba"/><stop offset="1" stop-color="#116329"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="210" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0" y="0" width="1000" height="210" rx="14" fill="#0757ba" fill-opacity="0.015"/>
  <text x="30" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#5b636c" letter-spacing="1.7">REGRA DE HONESTIDADE OPERACIONAL</text>
  <text x="30" y="62" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0d1117">Nenhuma etapa vale pela seguinte.</text>
  <line x1="100" y1="112" x2="900" y2="112" stroke="#e4e8ed" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="112" x2="900" y2="112" stroke="url(#track)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="800" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="2.4s" begin="0.2s" fill="freeze"/>
    </line>
  
    <g>
      
      <circle cx="100" cy="112" r="11" fill="#ffffff" stroke="#0757ba" stroke-width="2.4"/>
      <circle cx="100" cy="112" r="4.5" fill="#0757ba" filter="url(#glow)"/>
      <text x="100" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#0757ba" text-anchor="middle" letter-spacing="1">01</text>
      <text x="100" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d1117" text-anchor="middle">escrito</text>
      <text x="100" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5b636c" text-anchor="middle">commit</text>
    </g>
    <g>
      
      <circle cx="300" cy="112" r="11" fill="#ffffff" stroke="#3444c7" stroke-width="2.4"/>
      <circle cx="300" cy="112" r="4.5" fill="#3444c7" filter="url(#glow)"/>
      <text x="300" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#3444c7" text-anchor="middle" letter-spacing="1">02</text>
      <text x="300" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d1117" text-anchor="middle">testado</text>
      <text x="300" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5b636c" text-anchor="middle">6.533 testes</text>
    </g>
    <g>
      
      <circle cx="500" cy="112" r="11" fill="#ffffff" stroke="#6224b8" stroke-width="2.4"/>
      <circle cx="500" cy="112" r="4.5" fill="#6224b8" filter="url(#glow)"/>
      <text x="500" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#6224b8" text-anchor="middle" letter-spacing="1">03</text>
      <text x="500" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d1117" text-anchor="middle">executado no servidor</text>
      <text x="500" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5b636c" text-anchor="middle">log do ambiente</text>
    </g>
    <g>
      
      <circle cx="700" cy="112" r="11" fill="#ffffff" stroke="#a8215f" stroke-width="2.4"/>
      <circle cx="700" cy="112" r="4.5" fill="#a8215f" filter="url(#glow)"/>
      <text x="700" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#a8215f" text-anchor="middle" letter-spacing="1">04</text>
      <text x="700" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d1117" text-anchor="middle">em produ&#231;&#227;o</text>
      <text x="700" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5b636c" text-anchor="middle">evid&#234;ncia de deploy</text>
    </g>
    <g>
      <circle cx="900" cy="112" r="13" fill="none" stroke="#116329" stroke-width="1.4" stroke-opacity="0.5">
        <animate attributeName="r" values="13;26" dur="2.6s" begin="1.98s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="2.6s" begin="1.98s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="112" r="11" fill="#ffffff" stroke="#116329" stroke-width="2.4"/>
      <circle cx="900" cy="112" r="4.5" fill="#116329" filter="url(#glow)"/>
      <text x="900" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#116329" text-anchor="middle" letter-spacing="1">05</text>
      <text x="900" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d1117" text-anchor="middle">validado externamente</text>
      <text x="900" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5b636c" text-anchor="middle">homologa&#231;&#227;o do &#243;rg&#227;o</text>
    </g>
  <text x="500" y="194" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#5b636c" text-anchor="middle">C&#243;digo na main n&#227;o &#233; prova de deploy. Pedido ao DATASUS n&#227;o &#233; homologa&#231;&#227;o.</text>
</svg>
